<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http://localhost:* https://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MCM98 Launcher</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('mcm98.theme')
        var knownThemes = [
          'modern-dark',
          'modern-light',
          'retro-dark',
          'retro-light',
          'bubbly-dark',
          'bubbly-light',
          'rocker-dark',
          'rocker-light',
          'ghost-dark',
          'ghost-light'
        ]
        if (knownThemes.indexOf(savedTheme) !== -1) {
          document.documentElement.dataset.theme = savedTheme
          document.documentElement.style.colorScheme =
            savedTheme.indexOf('-light') !== -1 ? 'light' : 'dark'
        }
      } catch (error) {
        /* Storage can be unavailable; the in-app theme still applies. */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
